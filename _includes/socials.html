{% comment %}Social icon row, driven by `author:` in _config.yml.{% endcomment %}
<div class="social-row">
  {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"><i class="fab fa-github"></i></a>{% endif %}
  {% if site.author.linkedin %}<a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn"><i class="fab fa-linkedin"></i></a>{% endif %}
  {% if site.author.googlescholar %}<a href="{{ site.author.googlescholar }}" target="_blank" rel="noopener" aria-label="Google Scholar" title="Google Scholar"><i class="ai ai-google-scholar"></i></a>{% endif %}
  {% if site.author.kaggle %}<a href="https://www.kaggle.com/{{ site.author.kaggle }}" target="_blank" rel="noopener" aria-label="Kaggle" title="Kaggle"><i class="fab fa-kaggle"></i></a>{% endif %}
  {% if site.author.email %}<a href="mailto:{{ site.author.email }}" aria-label="Email" title="Email"><i class="fas fa-envelope"></i></a>{% endif %}
</div>
