---
layout: archive
title: "Experience"
permalink: /experience/
author_profile: true
---

<h2 class="section-heading section-heading--gradient">Experience</h2>

<div class="timeline">
  {% for x in site.data.experience %}
  <div class="tl-item reveal">
    <div class="tl-card">
      <div class="tl-head">
        <img class="tl-logo" src="{{ x.logo }}" alt="{{ x.org }}">
        <div>
          <div class="tl-org">{{ x.org }}</div>
          <div class="tl-role">{{ x.role }}{% if x.dates %} · {{ x.dates }}{% endif %}</div>
        </div>
      </div>
      {% if x.badge %}<span class="tl-badge">{{ x.badge }}</span>{% endif %}
      <div class="tl-body">{{ x.body }}</div>
    </div>
  </div>
  {% endfor %}
</div>
