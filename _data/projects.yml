- featured: true
  title: "Attention Kernel Portability Across GPU Architectures"
  url: /projects/attention-kernel-portability/
  image: /projects/attention-kernel-portability/figures/figA_separation.png
  meta: "Independent research · 6 NVIDIA GPUs, 4 architecture families"
  desc: >
    A measured study of whether an attention backend chosen on one GPU stays the right choice on another,
    across forward prefill and single-token KV-cache decode, with bootstrap separation, dispatch probing
    and transfer-cost analysis. Published as an interactive Astro/Observable Plot article.
  tags: [GPU Kernels, Benchmarking, PyTorch, Inference]

