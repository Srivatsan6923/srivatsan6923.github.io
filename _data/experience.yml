# Research/work roles, newest first. Rendered by _pages/experience.html.
# `dates` is optional; an entry without it renders the role on its own.
- org: "CIPRA.ai"
  logo: /images/cipra_ai.jpg
  role: "Data Science / ML Intern"
  dates: "May 2026 – Present"
  badge: "Healthcare Data Science · Patient Retention · Agentic AutoML"
  body: >
    Leading the churn and patient-retention analytics workstream for remote hypertension and diabetes
    programs, analyzing longitudinal patient histories to derive data-driven at-risk and behavioral-churn
    thresholds, disengagement taxonomies, and early warning triggers. Translating these patterns into
    clinical and operational intervention protocols for identifying and re-engaging patients before churn.
    In parallel, I built a cuffless BP estimation pipeline from raw PPG, using autonomous AutoML agents to
    optimize few-shot subject-specific calibration from as few as ~10 samples.

- org: "Playar"
  logo: /images/playar.jpg
  role: "Mobile Computer Vision Intern"
  dates: "Jun 2026 – Present"
  badge: "Multi-View Vision · 3D Reconstruction · On-Device ML"
  body: >
    Building a multi-view computer vision system for cricket analytics using synchronized high-frame-rate
    iPhone video to reconstruct ball trajectories and estimate how shots played in practice nets would carry
    and land under different ground settings. My work spans CVAT-based dataset curation, YOLO/CoreML training
    and benchmarking, single-view ball detection, two-view synchronization and tracking, camera calibration,
    and 3D trajectory reconstruction.

- org: "Prof. Pengtao Xie @ UC San Diego"
  logo: /images/UCSD.png
  role: "Graduate Student Researcher"
  dates: "Apr 2026 – Present"
  badge: "Agentic AI · Autonomous ML · Test-Time Scaling"
  body: >
    Developing efficient search and memory architectures for autonomous data-engineering agents, enabling
    knowledge reuse across tasks while reducing time and inference/API cost. My research explores cross-task
    memory, multi-agent coordination, self-evolving workflows, and test-time scaling for data-centric
    autonomous AI.

- org: "MiRL @ Indian Institute of Technology, Madras"
  logo: /images/IIT_Madras.png
  role: "Research Assistant"
  dates: "Jun 2024 – Aug 2025"
  badge: "3D Computer Vision · AI in Healthcare"
