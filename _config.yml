# Site-wide settings. Restart `jekyll serve` after editing this file.

# ---------------------------------------------------------------- Basic
locale                   : "en-US"
title                    : "Srivatsan Sarvesan"
title_separator          : "-"
name                     : &name "Srivatsan Sarvesan"
description              : &description "Srivatsan Sarvesan — MS ECE (ML & Data Science) @ UC San Diego. Medical imaging, agentic AI, multimodal learning."
url                      : https://srivatsan6923.github.io
baseurl                  : ""
repository               : "Srivatsan6923/srivatsan6923.github.io"

# ---------------------------------------------------------------- Author
# Drives the sidebar profile (_includes/author-profile.html) and the social
# icon rows (_includes/socials.html). Blank fields are simply not rendered.
author:
  avatar           : "Srivatsan_profile_pic.jpg"
  name             : *name
  bio              : "MS ECE (MLDS) @ UCSD | B.Tech ECE @ NITT | Exchange Student @ IITM"
  location         : "San Diego, USA"
  email            : "srivatsan6923@gmail.com"
  googlescholar    : "https://scholar.google.com/citations?user=kM3H-xcAAAAJ&hl=en"
  github           : "Srivatsan6923"
  kaggle           : "srivatsansarvesan"
  linkedin         : "srivatsan-sarvesan-b711a3223"

# ---------------------------------------------------------------- SEO
google_site_verification :
og_image                 :
social:
  type                   : Person
  name                   : *name
  links:
    - "https://github.com/Srivatsan6923"
    - "https://www.linkedin.com/in/srivatsan-sarvesan-b711a3223"
    - "https://scholar.google.com/citations?user=kM3H-xcAAAAJ&hl=en"

# ---------------------------------------------------------------- Reading files
include:
  - _pages
  - files
exclude:
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - package.json*
  - README.md
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ---------------------------------------------------------------- Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ---------------------------------------------------------------- Collections
# Collections back the listing pages; only projects and teaching get detail pages.
collections:
  projects:
    output: true
    permalink: /:collection/:path/
  # Data source for the publications list only — no per-paper detail pages.
  publications:
    output: false
  teaching:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: { path: "", type: pages }
    values: { layout: single, author_profile: true }
  - scope: { path: "", type: projects }
    values: { layout: single, author_profile: false }
  - scope: { path: "", type: teaching }
    values: { layout: single, author_profile: true }

# ---------------------------------------------------------------- Output
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

compress_html:
  clippings: all
  ignore:
    envs: development
